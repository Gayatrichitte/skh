<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-center items-center relative overflow-hidden">
<!-- Atmospheric Background Decoration -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-sage/30 rounded-full blur-3xl opacity-50"></div>
<div class="absolute top-1/2 -right-32 w-[30rem] h-[30rem] bg-secondary-container/20 rounded-full blur-3xl opacity-60"></div>
</div>
<main class="w-full max-w-md px-margin-mobile z-10">
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-sage rounded-xl flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="eco" data-weight="fill" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary text-center">KisanSathi</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2">Cultivating smarter farming.</p>
</div>
<div class="bg-surface-container-lowest border border-sage rounded-xl p-sm shadow-[0_4px_12px_rgba(33,37,41,0.05)] w-full">
<h2 class="font-headline-md text-headline-md text-charcoal mb-6 text-center">Welcome Back</h2>
<form action="#" class="space-y-6">
<!-- Mobile Number Input -->
<div class="flex flex-col">
<label class="font-label-md text-label-md text-charcoal mb-xs" for="mobile">Mobile Number</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full bg-surface-container-lowest border border-sage rounded-lg py-3 pl-10 pr-3 font-body-md text-body-md text-charcoal placeholder-outline-variant focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="mobile" name="mobile" placeholder="Enter your 10-digit number" type="tel">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col">
<div class="flex justify-between items-center mb-xs">
<label class="font-label-md text-label-md text-charcoal" for="password">Password</label>
<a class="font-label-sm text-label-sm text-leaf hover:text-secondary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest border border-sage rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-charcoal placeholder-outline-variant focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" name="password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-charcoal transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-4 flex flex-col gap-4">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-95 duration-200" type="submit">
                        Login
                    </button>
<button class="w-full bg-transparent border-2 border-primary text-primary font-label-md text-label-md py-3 rounded-lg hover:bg-sage/20 transition-colors active:scale-95 duration-200" type="button">
                        Sign Up
                    </button>
</div>
</form>
</div>
