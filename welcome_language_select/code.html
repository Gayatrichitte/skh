<style>

            animation: fadeInUp 0.8s ease-out forwards;

            transform: translateY(20px);
        }

<!-- Background Image -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40" data-alt="A soft-focus, golden hour photograph of a vast, tranquil wheat field under a pale sky. The image is light, airy, and very low contrast, functioning as a subtle background texture. The color palette emphasizes warm cream and faint amber tones, creating a premium, modern agricultural aesthetic without overwhelming the foreground UI." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBN8uj2pYA7E3jpkyGlxfzmelpIEAcIDRDi1wjmxtLgyKSqfDNCRAlIZecDa1yGmyeAlEyTBaPZWPJ2rfSFUEooTqwKgNkL9lrS1D_Omx5Sa7V9c9FWlVOtAjOb_V67VdRd4DpK7OSDkfbUnpJo_llYgrHAUei6nw2Xx4exVLBKREF0veRV20zI5O-wYkVIWs6mvvkhoS7NGE-QzDqV5RZT45zICNFFcBnmBKWi-vuO2MHXd0NL5g2x')"></div>

<!-- Brand Header -->
<div class="text-center mb-xl fade-in-up">
<div class="inline-flex items-center justify-center bg-secondary-container text-on-secondary-container p-sm rounded-full mb-md shadow-sm">

</div>
<h1 class="font-headline-xl text-headline-xl text-primary mb-xs">KisanSathi</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">Select your preferred language to begin</p>
</div>

<div class="w-full max-w-sm flex flex-col gap-sm">
<!-- Card 1 -->
<button class="w-full text-left glass-card rounded-xl p-md flex items-center justify-between hover:bg-surface-container transition-colors duration-300 fade-in-up delay-100 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-sage/0 via-sage/10 to-sage/0 -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>

<div class="w-10 h-10 rounded-full bg-sage flex items-center justify-center text-primary font-headline-md text-headline-md">
